<!doctype html>
<html lang="ne">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        padding: 0 0 2px;
        background: var(--page-bg, #f7f8fa);
        color: var(--ink, #17212b);
        font: 15px/1.7 'DM Sans', 'Noto Sans Devanagari', Arial, sans-serif;
      }
      .feed { display: flex; flex-direction: column; }
      .update-card {
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr) 40px;
        gap: 14px;
        align-items: start;
        margin-top: 14px;
        padding: 24px 16px;
        border: 1px solid var(--border, #e1e5ea);
        border-radius: 12px;
        background: var(--surface, #fff);
      }
      .card-number { padding-top: 3px; color: var(--muted, #596574); font-size: 12px; font-variant-numeric: tabular-nums; }
      .card-body { min-width: 0; }
      .card-date { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; color: var(--muted, #596574); font-size: 13px; }
      .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #62a97d; }
      h3 { margin: 0 0 5px; color: var(--ink, #17212b); font-size: 20px; line-height: 1.55; font-weight: 650; overflow-wrap: anywhere; }
      .card-content {
        display: -webkit-box;
        overflow: hidden;
        margin: 10px 0 0;
        color: var(--muted, #596574);
        font-size: 15px;
        line-height: 1.8;
        white-space: pre-line;
        overflow-wrap: anywhere;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
      }
      .card-content.expanded { display: block; overflow: visible; -webkit-line-clamp: unset; }
      .read-more { margin-top: 10px; padding: 2px 0; border: 0; background: transparent; color: var(--green, #176b4a); font: 600 13px Arial, sans-serif; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
      .card-footer { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
      .department { color: var(--muted, #596574); font-size: 12px; }
      .attachment-count { padding: 5px 9px; border-radius: 999px; background: var(--chip, #f1f4f6); color: var(--muted, #596574); font-size: 11px; }
      .card-open { display: grid; place-items: center; width: 38px; height: 38px; border: 1px solid var(--border, #e1e5ea); border-radius: 9px; color: var(--green, #176b4a); font-size: 20px; text-decoration: none; }
      .card-open:hover { background: var(--green, #176b4a); color: var(--surface, #fff); }
      .card-open:focus-visible, .read-more:focus-visible { outline: 3px solid #62c796; outline-offset: 3px; }
      * { transition: none !important; }
      ::selection { background: #62c79655; color: inherit; }
      @media (max-width: 600px) {
        .update-card { grid-template-columns: 25px minmax(0, 1fr) 34px; gap: 9px; padding: 18px 12px; }
        h3 { font-size: 18px; }
        .card-content { font-size: 14px; }
        .card-open { width: 34px; height: 34px; }
      }
    </style>
  </head>
  <body>
    <main class="feed" aria-live="polite"></main>
    <script type="module" src="/src/feed-frame.ts"></script>
  </body>
</html>
